<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F4F4A"/>
      <stop offset="100%" stop-color="#0A3D3D"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FBFF"/>
      <stop offset="100%" stop-color="#CDEBFA"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- fan/snowflake hybrid mark, centered at 256,256 -->
  <g transform="translate(256,256)">
    <!-- three swirl blades, like a fan/snowflake -->
    <g fill="url(#blade)">
      <path d="M0,-14 C40,-70 60,-120 40,-166 C74,-140 92,-92 78,-40 C68,-4 34,-6 0,-14 Z"/>
      <path d="M0,-14 C40,-70 60,-120 40,-166 C74,-140 92,-92 78,-40 C68,-4 34,-6 0,-14 Z" transform="rotate(120)"/>
      <path d="M0,-14 C40,-70 60,-120 40,-166 C74,-140 92,-92 78,-40 C68,-4 34,-6 0,-14 Z" transform="rotate(240)"/>
    </g>
    <!-- center hub -->
    <circle r="34" fill="#F7FDFF"/>
    <circle r="34" fill="none" stroke="#0369A1" stroke-width="6"/>
  </g>
</svg>
